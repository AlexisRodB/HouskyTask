<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HouskyTask - Agregar Tarea</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    .text-secondary { color: #cbd5e1 !important; }
    .text-muted { color: #94a3b8 !important; }
  </style>
</head>
<body class="d-flex flex-column flex-lg-row">

  <!-- sidebar -->
  <nav class="sidebar-desktop d-none d-lg-flex flex-column flex-shrink-0 p-3" style="width: 280px; min-height: 100vh; background-color: var(--bg-surface); border-right: 1px solid var(--border-color);">
    <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none text-white">
      <i class="bi bi-check2-square fs-4 me-2" style="color: var(--accent-orange);"></i>
      <span class="fs-5 fw-bold">HouskyTask</span>
    </a>
    <hr style="border-color: var(--border-color);">
    
    <div class="text-secondary small mb-2 text-uppercase fw-bold" style="font-size: 0.75rem;">Espacio personal</div>
    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li>
        <a href="index.html" class="nav-link text-secondary">
          <i class="bi bi-house-door me-2"></i> Inicio
        </a>
      </li>
      <li class="nav-item">
        <a href="agregarTarea.html" class="nav-link active text-white" style="background-color: rgba(255,107,0,0.15); border-left: 3px solid var(--accent-orange);">
          <i class="bi bi-plus-circle me-2"></i> Agregar tarea
        </a>
      </li>
      <li>
        <a href="todasTareas.html" class="nav-link text-secondary">
          <i class="bi bi-list-task me-2"></i> Todas las tareas
        </a>
      </li>
      <li>
        <a href="calendario.html" class="nav-link text-secondary">
          <i class="bi bi-calendar3 me-2"></i> Calendario
        </a>
      </li>
      <li>
        <a href="perfil.html" class="nav-link text-secondary">
          <i class="bi bi-person me-2"></i> Perfil
        </a>
      </li>
      <li>
        <a href="tablero.html" class="nav-link text-secondary">
          <i class="bi bi-kanban me-2"></i> Tablero visual
        </a>
      </li>
    </ul>

    <div class="mt-auto pt-3 border-top" style="border-color: var(--border-color) !important;">
      <a href="index.html" class="btn btn-outline-secondary w-100 btn-sm text-white">
        <i class="bi bi-arrow-left me-1"></i> Volver al inicio
      </a>
    </div>
  </nav>

  <main class="flex-grow-1 p-4 overflow-y-auto" style="max-width: 800px; margin: 0 auto;">
    
    <div class="mb-4">
      <a href="index.html" class="text-decoration-none text-secondary small mb-2 d-inline-block">
        <i class="bi bi-arrow-left"></i> Volver al tablero
      </a>
      <h1 class="fw-bold text-white mb-1">Nueva Tarea</h1>
      <p class="text-secondary">Define los detalles de tu entregable y mantén tu semana bajo control.</p>
    </div>

    <div class="card-housky">
      <form id="task-form" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="task-title" class="form-label text-white fw-bold small">Título de la tarea <span class="text-danger">*</span></label>
          <input type="text" class="form-control bg-dark text-white border-secondary" id="task-title" placeholder="Ej. Desarrollar API de autenticación" required>
          <div class="invalid-feedback">Por favor ingresa un título para la tarea.</div>
        </div>

        <div class="mb-3">
          <label for="task-description" class="form-label text-white fw-bold small">Descripción</label>
          <textarea class="form-control bg-dark text-white border-secondary" id="task-description" rows="3" placeholder="Detalles o subtareas a realizar..."></textarea>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="task-duedate" class="form-label text-white fw-bold small">Fecha límite</label>
            <input type="date" class="form-control bg-dark text-white border-secondary" id="task-duedate">
          </div>

          <div class="col-md-6 mb-3">
            <label for="task-priority" class="form-label text-white fw-bold small">Prioridad</label>
            <select class="form-select bg-dark text-white border-secondary" id="task-priority">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="task-project" class="form-label text-white fw-bold small">Proyecto</label>
            <input type="text" class="form-control bg-dark text-white border-secondary" id="task-project" value="Portafolio" placeholder="Ej. Portafolio, Marca personal">
          </div>

          <div class="col-md-6 mb-3">
            <label for="task-status" class="form-label text-white fw-bold small">Estado inicial</label>
            <select class="form-select bg-dark text-white border-secondary" id="task-status">
              <option value="pendiente" selected>Seleccionar</option>
              <option value="en-curso">Pendiente</option>
              <option value="en-curso">En curso</option>
              <option value="completada">Completada</option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top" style="border-color: var(--border-color) !important;">
          <a href="index.html" class="btn btn-outline-secondary px-4">Cancelar</a>
          <button type="submit" class="btn btn-primary-housky px-4">
            <i class="bi bi-check-lg me-1"></i> Guardar tarea
          </button>
        </div>

      </form>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/adapters/inbound/dom/taskFormController.js"></script>
</body>
</html>
