<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HouskyTask - Todas las Tareas</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    .text-secondary { color: #cbd5e1 !important; }
    .text-muted { color: #94a3b8 !important; }
  </style>
</head>
<body class="d-flex flex-column flex-lg-row">

  <!-- ================= SIDEBAR (Escritorio) ================= -->
  <nav class="sidebar-desktop d-none d-lg-flex flex-column flex-shrink-0 p-3" style="width: 280px; min-height: 100vh; background-color: var(--bg-surface); border-right: 1px solid var(--border-color);">
    <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none text-white">
      <i class="bi bi-check2-square fs-4 me-2" style="color: var(--accent-orange);"></i>
      <span class="fs-5 fw-bold">HouskyTask</span>
    </a>
    <hr style="border-color: var(--border-color);">
    
    <div class="text-secondary small mb-2 text-uppercase fw-bold" style="font-size: 0.75rem;">Espacio personal</div>
    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li>
        <a href="index.html" class="nav-link text-secondary">
          <i class="bi bi-house-door me-2"></i> Inicio
        </a>
      </li>
      <li>
        <a href="agregarTarea.html" class="nav-link text-secondary">
          <i class="bi bi-plus-circle me-2"></i> Agregar tarea
        </a>
      </li>
      <li class="nav-item">
        <a href="todasTareas.html" class="nav-link active text-white" style="background-color: rgba(255,107,0,0.15); border-left: 3px solid var(--accent-orange);">
          <i class="bi bi-list-task me-2"></i> Todas las tareas
        </a>
      </li>
      <li>
        <a href="calendario.html" class="nav-link text-secondary">
          <i class="bi bi-calendar3 me-2"></i> Calendario
        </a>
      </li>
      <li>
        <a href="perfil.html" class="nav-link text-secondary">
          <i class="bi bi-person me-2"></i> Perfil
        </a>
      </li>
      <li>
        <a href="tablero.html" class="nav-link text-secondary">
          <i class="bi bi-kanban me-2"></i> Tablero visual
        </a>
      </li>
    </ul>

    <div class="mt-auto pt-3 border-top" style="border-color: var(--border-color) !important;">
      <a href="agregarTarea.html" class="btn btn-primary-housky w-100 btn-sm">
        <i class="bi bi-plus-lg me-1"></i> Nueva tarea
      </a>
    </div>
  </nav>

  <!-- ================= CONTENIDO PRINCIPAL ================= -->
  <main class="flex-grow-1 p-4 overflow-y-auto">
    
    <!-- Header -->
    <div class="mb-4 d-flex justify-content-between align-items-end flex-wrap gap-3">
      <div>
        <h1 class="fw-bold text-white mb-1">Todas las Tareas</h1>
        <p class="text-secondary mb-0">Gestiona, filtra y actualiza el estado de tus entregables.</p>
      </div>
      <a href="agregarTarea.html" class="btn btn-primary-housky">
        <i class="bi bi-plus-lg me-1"></i> Nueva tarea
      </a>
    </div>

    <!-- Filtros por Estado -->
    <div class="d-flex gap-2 mb-4 overflow-x-auto pb-2" id="filter-buttons-container">
      <button class="btn btn-sm btn-outline-secondary text-white active filter-btn" data-filter="todos">Todas</button>
      <button class="btn btn-sm btn-outline-secondary text-white filter-btn" data-filter="pendiente">Pendientes</button>
      <button class="btn btn-sm btn-outline-secondary text-white filter-btn" data-filter="en-curso">En curso</button>
      <button class="btn btn-sm btn-outline-secondary text-white filter-btn" data-filter="completada">Completadas</button>
    </div>

    <!-- Contenedor de Listado de Tareas -->
    <div class="d-flex flex-column gap-3" id="tasks-list-container">
      <!-- Se inyecta dinámicamente desde JS -->
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/adapters/inbound/dom/taskListController.js"></script>
</body>
</html>
