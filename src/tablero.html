<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HouskyTask - Pizarra Interactiva Pro</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    .text-secondary { color: #cbd5e1 !important; }
    .text-muted { color: #94a3b8 !important; }
    .whiteboard-container {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    #drawing-canvas {
      cursor: crosshair;
      background-color: #05070d;
      display: block;
      touch-action: none;
    }
    .tool-btn.active {
      background-color: var(--accent-orange) !important;
      color: #fff !important;
      border-color: var(--accent-orange) !important;
    }
    /* Estilo para contenedor de imágenes flotantes redimensionables */
    .pasted-image-wrapper {
      position: absolute;
      border: 2px dashed var(--accent-orange);
      cursor: move;
      user-select: none;
      display: inline-block;
      resize: both;
      overflow: hidden;
      max-width: 80%;
      max-height: 80%;
    }
    .pasted-image-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="d-flex flex-column flex-lg-row">

  <!-- ================= SIDEBAR (Escritorio) ================= -->
  <nav class="sidebar-desktop d-none d-lg-flex flex-column flex-shrink-0 p-3" style="width: 280px; min-height: 100vh; background-color: var(--bg-surface); border-right: 1px solid var(--border-color);">
    <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none text-white">
      <i class="bi bi-check2-square fs-4 me-2" style="color: var(--accent-orange);"></i>
      <span class="fs-5 fw-bold">HouskyTask</span>
    </a>
    <hr style="border-color: var(--border-color);">
    
    <div class="text-secondary small mb-2 text-uppercase fw-bold" style="font-size: 0.75rem;">Espacio personal</div>
    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li>
        <a href="index.html" class="nav-link text-secondary">
          <i class="bi bi-house-door me-2"></i> Inicio
        </a>
      </li>
      <li>
        <a href="agregarTarea.html" class="nav-link text-secondary">
          <i class="bi bi-plus-circle me-2"></i> Agregar tarea
        </a>
      </li>
      <li>
        <a href="todasTareas.html" class="nav-link text-secondary">
          <i class="bi bi-list-task me-2"></i> Todas las tareas
        </a>
      </li>
      <li>
        <a href="calendario.html" class="nav-link text-secondary">
          <i class="bi bi-calendar3 me-2"></i> Calendario
        </a>
      </li>
      <li>
        <a href="perfil.html" class="nav-link text-secondary">
          <i class="bi bi-person me-2"></i> Perfil
        </a>
      </li>
      <li class="nav-item">
        <a href="tablero.html" class="nav-link active text-white" style="background-color: rgba(255,107,0,0.15); border-left: 3px solid var(--accent-orange);">
          <i class="bi bi-kanban me-2"></i> Tablero visual
        </a>
      </li>
    </ul>

    <div class="mt-auto pt-3 border-top" style="border-color: var(--border-color) !important;">
      <a href="agregarTarea.html" class="btn btn-primary-housky w-100 btn-sm">
        <i class="bi bi-plus-lg me-1"></i> Nueva tarea
      </a>
    </div>
  </nav>

  <main class="flex-grow-1 p-4 d-flex flex-column" style="height: 100vh; overflow: hidden;">
    
    <!-- header -->
    <div class="mb-3 d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <h1 class="fw-bold text-white mb-1 fs-3">Tablero</h1>
        <p class="text-secondary small mb-0">Intuitiva y lista para tus mejores esquemas y darte una vision clara</p>
      </div>
      
      <div class="d-flex align-items-center gap-2 bg-dark p-2 rounded border border-secondary flex-wrap">
        <!-- lapiz y borrador -->
        <button id="tool-pen" class="btn btn-sm btn-dark text-white tool-btn active" title="Lápiz"><i class="bi bi-pencil"></i></button>
        <button id="tool-eraser" class="btn btn-sm btn-dark text-secondary tool-btn" title="Borrador"><i class="bi bi-eraser"></i></button>
        
        <div class="vr bg-secondary mx-1"></div>

        <!-- Menú Desplegable de Figuras Geométricas -->
        <div class="dropdown">
          <button class="btn btn-sm btn-dark border border-secondary text-secondary dropdown-toggle tool-btn d-flex align-items-center gap-1 px-2" type="button" data-bs-toggle="dropdown" id="shapes-dropdown-btn" title="Figuras geométricas">
            <i class="bi bi-bounding-box"></i> <span class="small" style="font-size: 0.75rem;">Formas</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-dark border-secondary">
            <li><a class="dropdown-item shape-option" href="#" data-shape="rect"><i class="bi bi-square me-2"></i> Cuadrado</a></li>
            <li><a class="dropdown-item shape-option" href="#" data-shape="circle"><i class="bi bi-circle me-2"></i> Círculo</a></li>
            <li><a class="dropdown-item shape-option" href="#" data-shape="line"><i class="bi bi-slash-lg me-2"></i> Línea recta</a></li>
          </ul>
        </div>

        <div class="vr bg-secondary mx-1"></div>

        <!-- Deshacer -->
        <button id="undo-btn" class="btn btn-sm btn-dark text-secondary" title="Deshacer (Ctrl+Z)"><i class="bi bi-arrow-counterclockwise"></i></button>

        <div class="vr bg-secondary mx-1"></div>

        <!-- Selector de Color -->
        <input type="color" id="color-picker" value="#ff6b00" class="form-control form-control-color bg-dark border-secondary p-0" style="width: 30px; height: 30px;" title="Color">

        <!-- Control Deslizante (Slider) Intuitivo para el Tamaño -->
        <div class="d-flex align-items-center gap-2 px-1">
          <i class="bi bi-circle-fill text-secondary" style="font-size: 0.5rem;" id="size-icon"></i>
          <input type="range" id="brush-size" min="1" max="40" value="5" class="form-range" style="width: 80px; accent-color: var(--accent-orange);" title="Grosor de trazo">
          <span id="size-label" class="text-secondary small fw-bold" style="font-size: 0.75rem; min-width: 25px;">5px</span>
        </div>

        <div class="vr bg-secondary mx-1"></div>

        <button id="clear-canvas-btn" class="btn btn-sm btn-outline-danger" title="Limpiar todo"><i class="bi bi-trash"></i></button>
        <button id="save-canvas-btn" class="btn btn-sm btn-primary-housky" title="Guardar"><i class="bi bi-download"></i></button>
      </div>
    </div>

    <!-- Lienzo con contenedor para imágenes -->
    <div class="whiteboard-container flex-grow-1 w-100 d-flex position-relative" id="canvas-container">
      <canvas id="drawing-canvas"></canvas>
    </div>

  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Controlador Pizarra Pro -->
  <script type="module" src="./js/adapters/inbound/dom/whiteboardController.js"></script>
</body>
</html>
